function addCrs(CrName) {

    const li = document.createElement('li');

    crList.appendChild(li);

}

const addCrButton = document.getElementById('add-cr-btn');

    console.log("event called");

});

// FIXED KEYBOARD PART: Changed window to document and added preventDefault()
document.addEventListener('keydown', function(event) {
    if(event.key === 'Enter') {
        event.preventDefault(); // Stops the browser from clicking the active button again
        const name = prompt("Enter a new CR name:");
        addCrs(name);
    }
});
