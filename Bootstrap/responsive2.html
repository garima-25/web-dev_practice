<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB Tech LAB</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
        }

        #menu-toggle {
            display: none;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background-color: #1e293b;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 1000;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hamburger {
            font-size: 24px;
            cursor: pointer;
            /* user-select: none;  */
        }

        .logo {
            font-weight: bold;
            font-size: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        aside {
            position: fixed;
            top: 60px;
            left: -100%;
            bottom: 0;
            width: 250px;
            background-color: #0f172a;
            padding-top: 20px;
            transition: left 0.3s ease;
            z-index: 999;
        }

        aside a {
            display: block;
            padding: 15px 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 16px;
        }

        /* aside a:hover {
            background-color: #1e293b;
            color: white;
        } */

        main {
            margin-top: 60px;
            padding: 40px 20px;
            /* transition: margin-left 0.3s ease; */
        }

        #menu-toggle:checked ~ aside {
            left: 0;
        }

        @media (min-width: 769px) {
            #menu-toggle:checked ~ main {
                margin-left: 250px;
            }
        }

        @media (max-width: 768px) {
            aside {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <input type="checkbox" id="menu-toggle">

    <header>
        <div class="header-left">
            <label for="menu-toggle" class="hamburger">&#9776;</label>
            <div class="logo">University Portal</div>
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">Courses</a>
            <a href="#">Profile</a>
        </nav>
    </header>

    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Courses</a>
        <a href="#">Settings</a>
        <a href="#">Logout</a>
    </aside>

    <main>
        <h2>Welcome to the University Dashboard</h2>
        <p>This is your main content area. Resize the window or use the hamburger icon to see the responsive behavior.</p>
    </main>

</body>
</html>
