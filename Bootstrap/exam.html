<!DOCTYPE html>
<html>
<head>
    <title>Exam Layout</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        /* 1. Header (Fixed Top) */
        header {
            position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: #eee; display: flex; justify-content: space-between; align-items: center; padding: 10px;
        }
        
        /* 2. Sidebar (Fixed Left) */
        aside {
            position: fixed; top: 50px; left: 0; bottom: 30px; width: 200px;
            background: #ddd; padding: 10px;
        }
        aside a { display: block; padding: 10px; color: black; text-decoration: none; }
        aside a:hover { background: #bbb; } /* Hover effect required */

        /* 3. Main Content (Offsets for fixed elements + Responsive Grid) */
        main { margin: 50px 0 30px 200px; padding: 20px; }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); /* Responsive formula */
            gap: 15px;
        }
        .card { display: flex; flex-direction: column; }
        .thumb { width: 100%; aspect-ratio: 16/9; background: #ccc; }

        /* 4. Footer (Fixed Bottom) */
        footer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 30px;
            background: #eee; text-align: center; line-height: 30px;
        }
        @media (max-width: 600px) {
           aside { display: none; }
           main { margin-left: 0; }
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">MyTube</div>
        <input type="text" placeholder="Search...">
        <div class="profile">👤</div>
    </header>

    <aside>
        <a href="#">Home</a>
        <a href="#">Trending</a>
        <a href="#">Subscriptions</a>
    </aside>

    <main>
        <div class="grid">
            <div class="card"><div class="thumb"></div><p>Video Title 1</p></div>
            <div class="card"><div class="thumb"></div><p>Video Title 2</p></div>
            <div class="card"><div class="thumb"></div><p>Video Title 3</p></div>
            <div class="card"><div class="thumb"></div><p>Video Title 4</p></div>
        </div>
    </main>

    <footer>&copy; 2026 MyTube</footer>

</body>
</html>
