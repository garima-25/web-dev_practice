<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing:border-box;
        }

        body {
            margin:0;
            background:white;
            font-family:Arial, sans-serif
        }

        .main {
            width:85%;
            height:630px;
            margin:40px auto;
            background:grey;
            border-radius:25px;
            overflow:hidden;
        }

        .top {
            height:110px;
            background:#8d4032;
            display:flex;
            align-items:center;
            padding:15px;
            gap:35px;
        }

        .circle {
            width: 100px;
            height: 60px;
            background: #d5f5e9;
            border-radius: 50%;
            margin: 15px;
        }

        .container {
            width: 100%;
            height:100px;
        }

        .box{
            width: 200px;
            height: 40px;
            background: #d5f5e9;
            margin: 10px;
        }

        .box1{
            width: 350px;
            height: 65px;
            background: #d5f5e9;
            margin-left: 10px;
            border-radius: 20px;
        }

        .bottom {
            height: 100px;
            background: #555555;
            display: flex;
            align-items: center;
            padding: 15px;
            gap: 35px;
        }

        .container{
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bigbox {
            width: 300px;
            height: 50px;
            background: #d5f5e9;
            margin: 10px;
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="top">
            <div class="circle"></div>
            <div class="box"></div>
            <div class="box"></div>
        <div class="box1"></div>
        <div class="circle"></div>
        </div>
        <div class="container">
            <div class="bigbox"></div>
            <div class="bigbox"></div>
            <div class="bigbox"></div>
        </div>
        <div class="bottom">
            <div class="circle"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
    </div>
</body>
</html>
