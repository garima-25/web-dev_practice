<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = 9087654;
        let count = 0;
        let sum = 0;
        while(num>0){
            let digit = num%10;
            sum = sum +digit;
            count++;
            num = Math.floor(num/10);
        }
        console.log("Number of Digits",count);
        console.log("Sum of Digits", sum);
    </script>
</body>
</html>
