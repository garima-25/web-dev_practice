<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        h1 {
            text-align: center;
            margin-top: 20px;
        }

        form {
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 5px;
            /* box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); */
        } 

        label {
            display: block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        input[type="password"],
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        input[type="radio"]
        /* input[type="checkbox"] */ { 
            margin-right: 10px;
        }

        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        /* button:hover {
            background-color: #0056b3;
        } */
    </style>
</head>

<body>

    <h1>Student Internship Form</h1>

    <!-- <form action="/register" method="post"> -->

        <form>
        <label for="name">Name:</label>
        <input type="text" name="name" placeholder="Enter your name" required>

        <label for="email">Email:</label>
        <input type="email" name="email" placeholder="Enter your email" required>

        <label for="phone">Phone:</label>
        <input type="tel" name="phone" placeholder="Enter your phone number" required>

        <label for="age">Age:</label>
        <input type="number" name="age" placeholder="Enter your age" required>

        <label for="dob">Date of Birth:</label>
        <input type="date" name="dob" required>

        <label for="password">Password:</label>
        <input type="password" name="password" placeholder="Enter your password" required>

        <label for="male">Male:</label>
        <input type="radio" value="male" name="gender" id="male">

        <label for="female">Female:</label>
        <input type="radio" value="female" name="gender" id="female">

        <label for="other">Other:</label>
        <input type="radio" value="other" name="gender" id="other">

        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d7071.2380922622515!2d77.59502426208934!3d27.605338025319202!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sin!4v1787139344417!5m2!1sen!2sin"
            width="600"
            height="450"
            style="border:0;"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin">
        </iframe>
        <button type="submit">Submit</button>
    </form>

</body>
</html>
