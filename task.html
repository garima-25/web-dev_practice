<body>
    Q2 <script>
        let num = 58342;
        let reverse = 0;
        let sum = 0;
        while(num>0){
            let digit = num%10;
            reverse = reverse*10+digit;
            sum= sum+digit;
            num= Math.floor(num/10);
        }
        console.log("Reversed Number:", reverse);
        console.log("Sum of Digit:", sum);
    </script>

</body>
